# Perfil solo para @DataJpaTest (ver MiembroIglesiaDaoTest).
#
# application.properties (el de src/main/resources) fija
# spring.jpa.database-platform=MariaDBDialect de forma explicita. Ese valor
# se hereda igual aunque @DataJpaTest reemplace el DataSource por H2 en
# memoria: Hibernate seguia generando "engine=InnoDB" al final de cada
# CREATE TABLE (sintaxis de MariaDB), y H2 lo rechazaba con un error de
# sintaxis en CADA tabla — el esquema completo quedaba vacio y las
# siguientes consultas fallaban con "Table X not found". Se sobreescribe
# aqui con el dialecto de H2 para que el DDL generado sea el correcto.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Tambien heredado de application.properties: con el quoting global activo,
# Hibernate citaba entre comillas hasta el valor literal de
# columnDefinition="DATE" (Iglesia.fechaFundacion), generando
# `"fecha_fundacion" "DATE"` -- H2 lo rechaza porque un tipo de dato no puede
# ir entre comillas. No hace falta en H2 (existe para evitar choques con
# palabras reservadas de MariaDB).
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
