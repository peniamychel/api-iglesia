spring.application.name=web-iglesia
server.address=0.0.0.0
server.port=8092
#configuracion de la sona horaria
#spring.jackson.time-zone=UTC
spring.jackson.time-zone=America/La_Paz



# Configuración de la base de datos MariaDB
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3307/iglev3
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Dialecto de MariaDB para JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

spring.jpa.hibernate.ddl-auto=update


# 1. Nivel general en INFO para evitar el ruido de Java y RMI
logging.level.root=INFO

# 2. DEBUG solo para el paquete real del proyecto
logging.level.com.mcmm=DEBUG

# 3. Silenciadores específicos para lo que te salía cada segundo
logging.level.sun.rmi=OFF
logging.level.javax.management=OFF


#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Forzar a Hibernate a usar los nombres tal como están en las anotaciones
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Configuración CORS (separar múltiples orígenes con coma)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}

# Configuración JWT
jwt.secret.key=${JWT_SECRET}
jwt.time.expiration=86400000
jwt.time.refresh-expiration=604800000
#cuanto es un dia  en milisegundos = 86400000, 7 dias = 604800000

# Configuración para Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.custom-css-url=/custom-css/custom-dark.css
#http://localhost:8092/swagger-ui/index.html

# Configuración para la subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads
file.base-url=${FILE_BASE_URL:http://localhost:8092}

# Si se debe lanzar una "NoHandlerFoundException" si no se encontró ningún controlador para procesar una solicitud.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

server.max-http-request-header-size=64KB

# Compresion de respuestas HTTP (reduce el tamaño de los payloads JSON en la red)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/css,application/javascript
server.compression.min-response-size=1024
