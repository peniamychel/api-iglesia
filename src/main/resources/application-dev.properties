# Configuración Local (MariaDB Local)
spring.datasource.url=jdbc:mariadb://localhost:3307/iglev3
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Logs detallados para desarrollo
logging.level.root=INFO
logging.level.com.mcmm=DEBUG

# JWT y URL locales
jwt.secret.key=${JWT_SECRET}
jwt.time.expiration=86400000
jwt.time.refresh-expiration=604800000
file.upload-dir=uploads
file.base-url=http://localhost:8092